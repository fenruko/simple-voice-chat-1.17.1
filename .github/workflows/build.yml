name: Build 1.17.1 Fabric

on:
  push:
    branches:
      - 'arena/01a0d8ef-simple-voice-chat-1-17-1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voicechat-1171-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDKs (Gradle runs on 21, compile toolchain 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Build Fabric jar
        run: ./gradlew :fabric:build --stacktrace

      - name: Collect jars
        run: |
          set -e
          mkdir -p builds
          find fabric/build/libs -name '*.jar' \
            ! -name '*-sources*' \
            ! -name '*-dev*' \
            ! -name '*-javadoc*' \
            -exec cp -v {} builds/ \;
          echo "=== Collected ==="
          ls -la builds/
          for j in builds/*.jar; do
            echo "=== Contents of $j (first 60 entries) ==="
            unzip -l "$j" | head -60
          done
          JAR=$(ls builds/voicechat-fabric*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then echo "ERROR: voicechat-fabric jar not found"; exit 1; fi
          echo "=== fabric.mod.json inside $JAR ==="
          unzip -p "$JAR" fabric.mod.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicechat-1.17.1-fabric-jars
          path: builds/*.jar
          if-no-files-found: error

      - name: Commit jars to branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/*.jar
          if git diff --cached --quiet; then
            echo "No jar changes to commit"
            exit 0
          fi
          git commit -m "ci: build 1.17.1 fabric jars [skip ci]"
          git push
